plugins {
	id 'java'
}

group = 'dev.spawnersearch'
version = '1.0.0'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.google.code.gson:gson:2.13.2'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

// One jar with Gson inside: "java -jar spawner-search-discord.jar" is all it takes.
jar {
	archiveBaseName = 'spawner-search-discord'
	archiveVersion = ''
	manifest.attributes 'Main-Class': 'dev.spawnersearch.bridge.Bridge'
	from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
