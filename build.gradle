plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// For prodClient: Fabric API as the finished jar, the way a player installs it.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Runs the finished jar in a real Minecraft, like a player would. Self-test with a direct start
// into a singleplayer world (it stays off the public relay):
//   ./gradlew prodClient -Pselftest -Pworld="New World"
// 1440x810 gives GUI scale 3 = 480x270, like a 1080p screen with "Auto".
tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	runDir = layout.projectDirectory.dir('run-prod')
	// A test run is never "up to date".
	outputs.upToDateWhen { false }
	programArgs.addAll('--version', project.minecraft_version, '--accessToken', '0', '--username', 'Selbsttest')
	if (project.hasProperty('selftest')) {
		jvmArgs.add('-Dspawnersearch.selftest=full')
		programArgs.addAll('--width', '1440', '--height', '810')
	}
	if (project.hasProperty('world')) {
		programArgs.addAll('--quickPlaySingleplayer', project.property('world').toString())
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
